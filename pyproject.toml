[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscan"
version = "0.1.0"
description = "Static analysis for agent skill folders: dangerous shell, prompt-injection markers, credential leaks, duplicate names."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ipanalytics" }]
keywords = ["agents", "skills", "security", "linter", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
skillscan = "skillscan:main"

[tool.setuptools]
py-modules = ["skillscan"]

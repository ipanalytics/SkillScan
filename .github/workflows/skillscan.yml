name: SkillScan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skillscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: python3 -m unittest discover -s tests

      # Point this at your own skill tree. The example tree ships with a
      # baseline, so a fresh clone is green and new findings fail the job.
      - name: Scan the fixture tree, fail only on new findings
        run: |
          python3 skillscan.py examples \
            --baseline examples/.skillscan-baseline.json \
            --annotations --fail-on high
